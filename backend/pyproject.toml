[project]
name = "ai-document-intelligence-backend"
version = "0.1.0"
description = "Backend FastAPI de AI Document Intelligence Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.161.1",
    "openai>=3.37.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=1.28.2,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Permite `from app.main import app` en las pruebas sin instalar el paquete.
pythonpath = ["."]
markers = ["openai: llama a la API real de OpenAI (cuesta dinero); ejecutar con -m openai"]
# Por defecto nunca se ejecutan pruebas de pago. `-m openai` en la línea de comandos
# sustituye a este filtro.
addopts = "-m 'not openai'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, B: bugs comunes, UP: sintaxis moderna.
select = ["E", "F", "I", "B", "UP"]
