services:
  db:
    # Imagen oficial de PostgreSQL 17 con la extensión pgvector ya incluida.
    # La usamos desde ahora para no cambiar de imagen en la Fase 4; la extensión
    # no se activa hasta que una migración ejecute CREATE EXTENSION.
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel # solo para desarrollo local
      POSTGRES_DB: docintel
    ports:
      # Solo accesible desde esta máquina, no desde la red.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crea la base de datos de pruebas la primera vez que se inicializa el volumen.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 2s
      timeout: 5s
      retries: 15

  # --- Entorno completo: `docker compose up --build` -----------------------------------
  # Para desarrollar en local basta con `docker compose up -d db` y ejecutar backend y
  # frontend fuera de Docker (ver README).

  backend:
    build: ./backend
    env_file:
      # Opcional: sin .env se usan los valores por defecto y los de `environment`.
      - path: .env
        required: false
    environment:
      # Dentro de la red de Compose la base de datos se llama "db", no "localhost".
      DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
      STORAGE_DIR: /data/storage
    volumes:
      - storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
    # Sin puertos publicados: solo es accesible a través del frontend (nginx).

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  storage:
