# Sirve la aplicación compilada y reenvía /api al backend (mismo origen: sin CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Un poco más que MAX_UPLOAD_SIZE_MB (20 MB) para que el backend dé el error 413 explicativo.
    client_max_body_size 21m;

    # Cabeceras de seguridad. La CSP solo permite recursos propios: aunque se colara HTML en
    # la página, no podría cargar scripts ni enviar datos a otros dominios.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El procesamiento de un PDF es síncrono (embeddings + resumen): puede tardar.
        proxy_read_timeout 300s;
    }

    # PDF original. La CSP general (object-src 'none') puede impedir que el visor de PDF del
    # navegador lo muestre, así que esta ruta lleva la suya. Un add_header aquí sustituye a
    # todos los del bloque server, por eso se repiten (nosniff ya lo envía el backend).
    location ~ ^/api/v1/documents/[^/]+/file$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location / {
        try_files $uri /index.html;
    }
}
